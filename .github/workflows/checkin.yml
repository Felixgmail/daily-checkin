name: Daily Checkin

on:
  schedule:
    # 每天 UTC 00:00 = 北京时间 08:00 (脚本会再加 0-40 分钟随机延迟,实际开跑 08:00-08:40)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支持手动触发(跳过启动延迟,立即跑)

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 启动延迟 0-40 分 + 同站串行(最坏 5 个账号 × 15 分钟间隔 = 60 分) + 网络请求,
    # 上限留宽一些防止意外耗时把 job 砍掉。
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checkin
        # 失败的签到不让整个 job 失败,这样下次定时还会继续跑
        # 想要失败标红可以删掉 continue-on-error
        continue-on-error: true
        env:
          # ===== makelove.cloud 多账号 =====
          # 新增账号: 在 Secrets 里加一对 MAKELOVE_<账号名>_TOKEN 和 MAKELOVE_<账号名>_USER_ID,
          # 然后在这里复制一对引用即可。脚本会自动发现并签到。
          MAKELOVE_A6732413_TOKEN: ${{ secrets.MAKELOVE_A6732413_TOKEN }}
          MAKELOVE_A6732413_USER_ID: ${{ secrets.MAKELOVE_A6732413_USER_ID }}
          MAKELOVE_JDUHG82736_TOKEN: ${{ secrets.MAKELOVE_JDUHG82736_TOKEN }}
          MAKELOVE_JDUHG82736_USER_ID: ${{ secrets.MAKELOVE_JDUHG82736_USER_ID }}
          MAKELOVE_ZHANGGUOHUA_TOKEN: ${{ secrets.MAKELOVE_ZHANGGUOHUA_TOKEN }}
          MAKELOVE_ZHANGGUOHUA_USER_ID: ${{ secrets.MAKELOVE_ZHANGGUOHUA_USER_ID }}
          MAKELOVE_LIYANGFENG_TOKEN: ${{ secrets.MAKELOVE_LIYANGFENG_TOKEN }}
          MAKELOVE_LIYANGFENG_USER_ID: ${{ secrets.MAKELOVE_LIYANGFENG_USER_ID }}
          # ===== 52mx.net 多账号 =====
          # 同样的命名约定 (M 前缀是因为 Secret 名不能以数字开头)
          M52MX_A6732413_TOKEN: ${{ secrets.M52MX_A6732413_TOKEN }}
          M52MX_A6732413_USER_ID: ${{ secrets.M52MX_A6732413_USER_ID }}
          M52MX_LINFANGJI_TOKEN: ${{ secrets.M52MX_LINFANGJI_TOKEN }}
          M52MX_LINFANGJI_USER_ID: ${{ secrets.M52MX_LINFANGJI_USER_ID }}
          # ===== api.uu6.top 多账号 =====
          UU6_A6732413_TOKEN: ${{ secrets.UU6_A6732413_TOKEN }}
          UU6_A6732413_USER_ID: ${{ secrets.UU6_A6732413_USER_ID }}
          # ===== api.iamhc.cn 多账号 =====
          IAMHC_LINDINGCHAN_TOKEN: ${{ secrets.IAMHC_LINDINGCHAN_TOKEN }}
          IAMHC_LINDINGCHAN_USER_ID: ${{ secrets.IAMHC_LINDINGCHAN_USER_ID }}
          IAMHC_FELIXSSFDF_TOKEN: ${{ secrets.IAMHC_FELIXSSFDF_TOKEN }}
          IAMHC_FELIXSSFDF_USER_ID: ${{ secrets.IAMHC_FELIXSSFDF_USER_ID }}
          # ===== ai.router.team 多账号 =====
          # 这个站点不是 New API: 用账号密码登录换 JWT 签到(JWT 24h 过期,存不了长期 token)。
          # 新增账号: 加一对 AIROUTER_<账号名>_USERNAME 和 AIROUTER_<账号名>_PASSWORD,再在这里复制一对引用。
          AIROUTER_LINFANLONG_USERNAME: ${{ secrets.AIROUTER_LINFANLONG_USERNAME }}
          AIROUTER_LINFANLONG_PASSWORD: ${{ secrets.AIROUTER_LINFANLONG_PASSWORD }}
          # tokenwork.app 已移除: 站点开启了 Cloudflare Turnstile 人机验证,纯脚本签不了
          # ===== aiapi1.cc.cd 多账号 (标准 New API) =====
          AIAPI1_A6732413_TOKEN: ${{ secrets.AIAPI1_A6732413_TOKEN }}
          AIAPI1_A6732413_USER_ID: ${{ secrets.AIAPI1_A6732413_USER_ID }}
          AIAPI1_LIYANGFENG_TOKEN: ${{ secrets.AIAPI1_LIYANGFENG_TOKEN }}
          AIAPI1_LIYANGFENG_USER_ID: ${{ secrets.AIAPI1_LIYANGFENG_USER_ID }}
          # ===== 通知通道 (任意配置一个或多个,不配置则不推送) =====
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py
