name: Probe Turnstile (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Probe with host-resolver-rules
        env:
          DDU_ACCESS_TOKEN: ${{ secrets.DIALOGUEDUI_LINDINGCHAN_ACCESS_TOKEN }}
          DDU_ACCESS_EXP: ${{ secrets.DIALOGUEDUI_LINDINGCHAN_ACCESS_EXP }}
        run: python scripts/probe_turnstile.py
