name: Probe Turnstile (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Add hosts for Turnstile challenge domain
        run: |
          # runner 的 DNS 解析不了 brunhild.challenges.cloudflare.com(动态挑战子域),
          # 指向 challenges.cloudflare.com 同 CDN 的 IP 试试
          echo "104.18.95.41 brunhild.challenges.cloudflare.com" | sudo tee -a /etc/hosts
          getent hosts brunhild.challenges.cloudflare.com || true
      - name: Probe
        env:
          DDU_ACCESS_TOKEN: ${{ secrets.DIALOGUEDUI_LINDINGCHAN_ACCESS_TOKEN }}
          DDU_ACCESS_EXP: ${{ secrets.DIALOGUEDUI_LINDINGCHAN_ACCESS_EXP }}
        run: python scripts/probe_turnstile.py
